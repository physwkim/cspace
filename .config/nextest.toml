# A regression that makes a test *hang* must be reported as a failure, not
# left to stall the suite forever.
#
# `crates/cspace-planners-stomp/src/planner.rs`'s
# `cancelling_from_another_thread_stops_a_plan_call_already_in_flight` sets
# `num_iterations = 1_000_000` deliberately, so that `proceed` going false is
# the only exit its `solve` call can take. That is the right shape for the
# test -- but it means the test detects "cancellation stopped working" by
# never terminating rather than by failing. Measured: neutering
# `CancelHandle::cancel` leaves it running past 240s with no output.
#
# nextest's default `slow-timeout` only *warns*; without `terminate-after`
# nothing ever kills a hung test, and this repository has no CI
# (PORTING-PLAN.md §174) to impose an outer bound. 60s x 5 = 300s so it cannot
# fire on a merely slow test while still turning any hang into a named
# failure.
#
# The headroom this comment used to quote -- "a little over 10x the slowest
# test (28.9s)" -- was measured before `e733f19` gave the workspace a
# `[profile.dev]`; the slowest test is now
# `cspace-distance-field::collision_env_distance_field_parity::group_state_representation_gradients_matches_the_oracle`
# at 1.713s, so the same 300s is ~175x. A ratio that moves 17x on a profile
# change is not what sizes this bound and should not be read as if it were.
# What has to hold is only the two-sided condition: 300s is far above any
# legitimately slow test in either profile, and far below a hang, which is
# unbounded by definition -- the neutered-`cancel` measurement above ran past
# 240s and would have run past any finite number.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
