name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
# Deliberately no `RUSTFLAGS: -D warnings` here. Cargo passes RUSTFLAGS to every
# unit it compiles, dependencies included, so it turns a warning in third-party
# code into a CI failure we cannot fix -- and a new rustc lint would break the
# build without anything in this repo changing. Strictness lives in
# [workspace.lints.rust] instead, which applies to workspace members only.

jobs:
  # The core crates carry no ROS dependency (PORTING-PLAN.md D1), so this job
  # runs on a plain runner with no ROS 2 install. That is the point: if it ever
  # needs one, the port has re-coupled and check-dep-direction catches it.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo nextest run --workspace
      - name: doctests
        run: cargo test --doc --workspace
      # `warnings = "deny"` in [workspace.lints.rust] covers rustdoc's lints too,
      # so a public doc comment linking to a private item is a hard error -- but
      # only under `cargo doc`, which none of the steps above run. Without this
      # step they accumulate silently: they reached 8 across four crates before
      # anyone looked, and a single round of new code took moveit-model from 7
      # to 11 on its own.
      - name: docs
        run: cargo doc --workspace --no-deps
      # Globbed, not enumerated. `tools/ci/verify-fixture-provenance.sh`'s header
      # and PORTING-PLAN both say `check-*.sh` is the set CI runs -- and named
      # that script `verify-*` specifically to stay out of it. That convention
      # only carries weight if this step derives from the glob: with three steps
      # listed by hand, a new `check-*.sh` would go unrun here while both
      # documents claimed otherwise. An empty glob fails rather than passing
      # vacuously, so a rename cannot silently empty the set.
      - name: ci checks
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(tools/ci/check-*.sh)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no tools/ci/check-*.sh found -- the glob CI runs is empty" >&2
            exit 1
          fi
          for s in "${scripts[@]}"; do
            echo "== $s"
            "$s"
          done

  # The differential harness needs the C++ oracle image, which takes long enough
  # to build that it is not run on every push. `workflow_dispatch` and the
  # nightly schedule are added once the image is published to a registry.
  # Until then: tools/moveit-oracle/build.sh, then
  # cargo run -p moveit-diff -- --urdf ... --srdf ...
