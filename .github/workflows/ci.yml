name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
# Deliberately no `RUSTFLAGS: -D warnings` here. Cargo passes RUSTFLAGS to every
# unit it compiles, dependencies included, so it turns a warning in third-party
# code into a CI failure we cannot fix -- and a new rustc lint would break the
# build without anything in this repo changing. Strictness lives in
# [workspace.lints.rust] instead, which applies to workspace members only.

jobs:
  # The core crates carry no ROS dependency (PORTING-PLAN.md D1), so this job
  # runs on a plain runner with no ROS 2 install. That is the point: if it ever
  # needs one, the port has re-coupled and check-dep-direction catches it.
  rust:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default `fetch-depth: 1`.
      # `check-porting-plan-sections.sh` compares each commit's set of
      # top-level plan sections against its parents', which needs the parents
      # to exist as objects. In a depth-1 checkout they do not, and
      # `git rev-list --parents -1 HEAD` prints the commit with no parents at
      # all -- so that check would compare nothing and report OK. It fails
      # loudly on a shallow checkout rather than skipping, and this is what
      # keeps it from having to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # `check-shellcheck.sh` treats a missing shellcheck as a FAIL rather
      # than a skip, so it needs the tool present, not merely likely to be.
      # `ubuntu-latest` currently ships one preinstalled, but that is an
      # image detail with no compatibility promise, and the gate is reached
      # through the `tools/ci/check-*` glob below rather than by name -- so
      # the day the image drops it, CI fails with the gate's own message and
      # nothing here would say why. Installing it explicitly is what makes
      # that a decision instead of an accident.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Asserted once here rather than by adding `--locked` to each of the four
      # steps below. `Cargo.lock` is tracked, so the intent is that CI builds
      # exactly what is committed -- but without this, a manifest edit that left
      # the lockfile stale makes cargo silently rewrite it and every step passes,
      # and "CI is green" then says nothing about the lockfile in the tree. One
      # up-front assertion is enough: if it holds, no later step has anything to
      # rewrite. It fails with cargo's own message naming the drifted package,
      # which the four steps individually would not.
      - name: lockfile
        run: cargo fetch --locked

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` matches the gate every worker runs locally. Without it
      # nextest stops at the first failure, so a push that broke three tests
      # reports one and the next two only surface on the next run -- and the
      # local gate and CI would disagree about what "the test step" means.
      - name: test
        run: cargo nextest run --workspace --no-fail-fast
      - name: doctests
        run: cargo test --doc --workspace
      # `warnings = "deny"` in [workspace.lints.rust] covers rustdoc's lints too,
      # so a public doc comment linking to a private item is a hard error -- but
      # only under `cargo doc`, which none of the steps above run. Without this
      # step they accumulate silently: they reached 8 across four crates before
      # anyone looked, and a single round of new code took moveit-model from 7
      # to 11 on its own.
      - name: docs
        run: cargo doc --workspace --no-deps
      # Globbed, not enumerated. `tools/ci/verify-fixture-provenance.sh`'s header
      # and PORTING-PLAN both say the `check-` prefix is the set CI runs -- and
      # named that script `verify-*` specifically to stay out of it. That
      # convention only carries weight if this step derives from the glob: with
      # three steps listed by hand, a new `check-` gate would go unrun here
      # while both documents claimed otherwise. An empty glob fails rather than
      # passing vacuously, so a rename cannot silently empty the set.
      #
      # The glob is on the PREFIX, not the extension. It read `check-*.sh` until
      # `e0e4ed8`, which silently excluded `check-citation-drift.py` -- named
      # `check-` and self-describing as needing "python3 and the tracked files
      # -- no docker, no cargo, no upstream", yet never once run by CI in its
      # whole life. A non-executable match is a hard failure for the same
      # reason: dropping the `+x` bit must not be a way to leave the set.
      #
      # Every gate runs even after one fails; failures are collected and
      # reported together at the end, the same shape `tools/ci/verify-all.sh`
      # already uses for the `verify-*` glob. Under the default `for s in
      # ...; do "$s"; done` this step aborted at the first failing gate --
      # runs 31135034802/92732383116 ran only 14 of 26 before `bash -eo
      # pipefail` killed the step on gate 15, so CI's red said nothing about
      # the other 12. `if ! "$s"; then` is exempt from `-e` (it is the
      # condition of an `if`), so this loop keeps going under the same shell
      # options instead of needing `set +e`.
      - name: ci checks
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(tools/ci/check-*)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no tools/ci/check-* found -- the glob CI runs is empty" >&2
            exit 1
          fi
          for s in "${scripts[@]}"; do
            if [[ ! -x "$s" ]]; then
              echo "$s matches the check-* glob but is not executable" >&2
              exit 1
            fi
          done
          failed=()
          for s in "${scripts[@]}"; do
            echo "== $s"
            if ! "$s"; then
              failed+=("$s")
            fi
          done
          echo
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "FAIL ${#failed[@]} of ${#scripts[@]} check(s) failed:" >&2
            printf '  %s\n' "${failed[@]}" >&2
            exit 1
          fi
          echo "OK all ${#scripts[@]} check(s) passed"

  # The differential harness needs the C++ oracle image, which takes long enough
  # to build that it is not run on every push. `workflow_dispatch` and the
  # nightly schedule are added once the image is published to a registry.
  # Until then: tools/moveit-oracle/build.sh, then
  # cargo run -p moveit-diff -- --urdf ... --srdf ...
