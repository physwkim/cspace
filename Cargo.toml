[workspace]
resolver = "3"
members = ["crates/*", "tools/moveit-diff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/stevek/moveit-rs"
authors = ["moveit-rs contributors"]

# Upstream reference: moveit2 @ e017c91ee12984393a28ba246075c65f69cde3bf
# See PORTING-PLAN.md for the port's scope and phase plan.

[workspace.dependencies]
moveit-collision = { path = "crates/moveit-collision", version = "0.1.0" }
moveit-constraints = { path = "crates/moveit-constraints", version = "0.1.0" }
moveit-error = { path = "crates/moveit-error", version = "0.1.0" }
moveit-geometry = { path = "crates/moveit-geometry", version = "0.1.0" }
moveit-kinematics = { path = "crates/moveit-kinematics", version = "0.1.0" }
moveit-model = { path = "crates/moveit-model", version = "0.1.0" }
moveit-octomap = { path = "crates/moveit-octomap", version = "0.1.0" }
moveit-sampling = { path = "crates/moveit-sampling", version = "0.1.0" }
moveit-srdf = { path = "crates/moveit-srdf", version = "0.1.0" }
moveit-state = { path = "crates/moveit-state", version = "0.1.0" }

nalgebra = { version = "0.35", features = ["serde-serialize"] }
roxmltree = "0.21"
parry3d-f64 = "0.30"
glamx = { version = "0.3", default-features = false, features = ["nalgebra"] }
urdf-rs = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`, not the default feature set. serde_json's own f64 parser
# is fast but not correctly rounded: it reads `10.049999999999999` as the f64
# nearest `10.05`, one ULP away from what `str::parse::<f64>` (and the C++
# oracle that wrote the literal) mean by it. Measured across every committed
# fixture, 6859 of 84221 float literals -- 8.1%, in 29 files across 9 crates --
# came back one ULP wrong; with the feature on, 0 do. That is invisible under a
# tolerance and fatal under `assert_eq!`, and worse, it silently sets the floor
# every tolerance bisection in this repo measures against. Pinned by
# tools/ci/check-serde-float-roundtrip.sh.
serde_json = { version = "1", features = ["float_roundtrip"] }
linkme = "0.3"
approx = "0.5"
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
# For moveit-sampling's standard-normal draws. Upstream CHOMP and STOMP both
# use std::normal_distribution; rand itself carries no distributions. Pinned
# with default-features off to match `rand` above -- verified to resolve to a
# single rand 0.10.2 with no duplicate, and to compile against rand_chacha.
rand_distr = { version = "0.6", default-features = false, features = ["std"] }
rsruckig = "3.0.0"

[workspace.lints.rust]
# Denied here rather than through a CI-only `RUSTFLAGS: -D warnings`: cargo
# applies this table to workspace members only, whereas RUSTFLAGS reaches every
# dependency too and would fail the build on a warning in code we neither own
# nor can fix. Keeping it in the manifest also means a local `cargo build` is
# as strict as CI.
warnings = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
