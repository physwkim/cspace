[workspace]
resolver = "3"
members = ["crates/*", "tools/moveit-diff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/stevek/moveit-rs"
authors = ["moveit-rs contributors"]

# Upstream reference: moveit2 @ e017c91ee12984393a28ba246075c65f69cde3bf
# See PORTING-PLAN.md for the port's scope and phase plan.
#
# One crate tracks a different upstream: moveit-stomp-core ports
# ros-industrial/stomp @ b1a87c80f7338caae25a5c689b876da15492aa75, the
# optimizer that moveit2's own moveit_planners/stomp only binds to. It gets
# its own crate rather than folding into moveit-planners-stomp because every
# audit command in this repo counts a crate's symbols against exactly one
# upstream, and two upstreams in one crate would break that premise.
#
# That crate is also the one place `license` above does not apply.
# ros-industrial/stomp is Apache-2.0 (`LICENSE`, `package.xml:9`, and a
# per-file header on every source including `src/utils.cpp`); every moveit2
# package this workspace ports is BSD-3-Clause (`moveit_core`,
# `moveit_planners/{stomp,chomp/*,pilz_industrial_motion_planner}` package.xml
# all read BSD-3-Clause). So moveit-stomp-core sets `license` explicitly
# rather than `license.workspace = true` -- inheriting here would relabel
# Apache-2.0-derived code as BSD-3-Clause.

[workspace.dependencies]
moveit-collision = { path = "crates/moveit-collision", version = "0.1.0" }
moveit-constraints = { path = "crates/moveit-constraints", version = "0.1.0" }
# For moveit-planners-chomp's ChompOptimizer, whose only use of upstream's
# `CollisionEnvHybrid` is a getCollisionGradients call that forwards to
# CollisionEnvDistanceField -- see PORTING-PLAN.md §139.
moveit-distance-field = { path = "crates/moveit-distance-field", version = "0.1.0" }
moveit-error = { path = "crates/moveit-error", version = "0.1.0" }
moveit-geometry = { path = "crates/moveit-geometry", version = "0.1.0" }
moveit-kinematics = { path = "crates/moveit-kinematics", version = "0.1.0" }
moveit-model = { path = "crates/moveit-model", version = "0.1.0" }
moveit-octomap = { path = "crates/moveit-octomap", version = "0.1.0" }
moveit-planner-registry = { path = "crates/moveit-planner-registry", version = "0.1.0" }
moveit-planners-sbp = { path = "crates/moveit-planners-sbp", version = "0.1.0" }
moveit-planning = { path = "crates/moveit-planning", version = "0.1.0" }
moveit-sampling = { path = "crates/moveit-sampling", version = "0.1.0" }
moveit-scene = { path = "crates/moveit-scene", version = "0.1.0" }
moveit-smoothing = { path = "crates/moveit-smoothing", version = "0.1.0" }
moveit-srdf = { path = "crates/moveit-srdf", version = "0.1.0" }
moveit-stomp-core = { path = "crates/moveit-stomp-core", version = "0.1.0" }
moveit-state = { path = "crates/moveit-state", version = "0.1.0" }
moveit-test-support = { path = "crates/moveit-test-support", version = "0.1.0" }
moveit-trajectory = { path = "crates/moveit-trajectory", version = "0.1.0" }

nalgebra = { version = "0.35", features = ["serde-serialize"] }
roxmltree = "0.21"
parry3d-f64 = "0.30"
glamx = { version = "0.3", default-features = false, features = ["nalgebra"] }
urdf-rs = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`, not the default feature set. serde_json's own f64 parser
# is fast but not correctly rounded: it reads `10.049999999999999` as the f64
# nearest `10.05`, one ULP away from what `str::parse::<f64>` (and the C++
# oracle that wrote the literal) mean by it. Measured across every committed
# fixture, 6859 of 84221 float literals -- 8.1%, in 29 files across 9 crates --
# came back one ULP wrong; with the feature on, 0 do. That is invisible under a
# tolerance and fatal under `assert_eq!`, and worse, it silently sets the floor
# every tolerance bisection in this repo measures against. Pinned by
# tools/ci/check-serde-float-roundtrip.sh.
serde_json = { version = "1", features = ["float_roundtrip"] }
linkme = "0.3"
approx = "0.5"
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
# For moveit-sampling's standard-normal draws. Upstream CHOMP and STOMP both
# use std::normal_distribution; rand itself carries no distributions. Pinned
# with default-features off to match `rand` above -- verified to resolve to a
# single rand 0.10.2 with no duplicate, and to compile against rand_chacha.
rand_distr = { version = "0.6", default-features = false, features = ["std"] }
rsruckig = "3.0.0"

[workspace.lints.rust]
# Denied here rather than through a CI-only `RUSTFLAGS: -D warnings`: cargo
# applies this table to workspace members only, whereas RUSTFLAGS reaches every
# dependency too and would fail the build on a warning in code we neither own
# nor can fix. Keeping it in the manifest also means a local `cargo build` is
# as strict as CI.
warnings = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The test suite is dominated by unoptimized numeric work, not by its own
# assertions: `gripper_pair_contact_is_prediction_invariant` builds the PR2
# model and runs three parry contact queries, and took 18.4s at the cargo
# default (`opt-level = 0`) against 0.9s here -- a 20x gap, measured, and the
# same shape across every PR2/distance-field parity test. Whole-workspace
# `cargo nextest run --workspace`: 24.2s before, 2.0s after.
#
# `opt-level = 1` for workspace crates rather than 2: the remaining gap to a
# release build was not measurable on these tests, and 1 keeps compile time
# and codegen debuggability closer to the default. Dependencies go to 2
# because they are compiled once and cached; they are nalgebra and
# parry3d-f64, where the numeric work actually happens.
#
# Cost, measured on this machine (96 cores, cold `CARGO_TARGET_DIR`,
# `cargo nextest run --workspace --no-run`): 25s at the default, 39s here.
# The +14s one-time build cost is repaid by the first test run.
#
# `debug-assertions` and `overflow-checks` are untouched and stay on -- they
# default to true for the dev profile independently of `opt-level`, verified
# here (`--print cfg` still emits `debug_assertions`, and an `u8` overflow
# still panics at `-C opt-level=1 -C debug-assertions=on`). A profile that
# silently turned those off would trade the suite's wall clock for its
# coverage.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
