[package]
name = "cspace-collision"
description = "RobotModel-independent parts of moveit_core/collision_detection: AllowedCollisionMatrix, the collision request/result types, and the World object container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `checkRobotCollisionHelperCCD`'s cast manager and callbacks. They are their
# own crate because `bullet_integration/` is BSD-2-Clause and this crate is
# BSD-3-Clause; see `cspace-bullet-cast`'s own module docs.
cspace-bullet-cast.workspace = true
cspace-core.workspace = true
# Not for the octree algorithms -- those stay in `cspace_core::geometry` -- but so
# `parry.rs`'s `OctreeCache` can name `Weak<cspace_core::octomap::OcTree>`. Keying a
# cache on an `Arc` address is only sound while something pins the
# allocation; see `OctreeCache`'s own doc. `cspace_core::geometry`, already a
# dependency here, depends on this crate too, so this adds no edge the graph
# did not have.
glamx.workspace = true
nalgebra.workspace = true
parry3d-f64.workspace = true

[dev-dependencies]
approx.workspace = true
cspace-core = { workspace = true, features = ["test-support"] }
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
urdf-rs.workspace = true

[lints]
workspace = true
