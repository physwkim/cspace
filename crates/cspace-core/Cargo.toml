[package]
name = "cspace-core"
description = "Configuration-space robot core: URDF/SRDF models, robot state, forward and inverse kinematics, geometry and shapes, octomap, trajectories and time parameterization. Ported from moveit_core and moveit_kinematics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
glamx.workspace = true
linkme.workspace = true
nalgebra.workspace = true
parry3d-f64.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
roxmltree.workspace = true
rsruckig.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
urdf-rs.workspace = true

[dev-dependencies]
approx.workspace = true

[features]
default = []
# Inert: `serde` is an unconditional dependency of this crate because most of
# its modules need it, so this gate only still exists to keep the `error`
# module's `#[cfg(feature = "serde")]` impls off by default -- which is what
# they were before the merge, when `cspace-error` declared serde optional and
# no crate in the workspace ever turned it on.
serde = []
# The fixture loaders `tests/` and downstream crates' tests share. Behind a
# feature so a released `cspace-core` does not carry them in its public API.
test-support = []

# Not `[lints] workspace = true`, for the same reason the pre-merge
# `cspace-kinematics` was not: D4 mandates `linkme::distributed_slice` for the
# IK solver registry (`src/kinematics/registry.rs`), every `distributed_slice`
# static expands to a `#[link_section]` static that rustc's `unsafe_code` lint
# flags, and `forbid` cannot be downgraded by the crate that inherits it.
#
# The exemption stays exactly as narrow as it was: `src/lib.rs` puts
# `#[forbid(unsafe_code)]` on every module except `kinematics`, so folding
# eleven former crates in here does not widen it to their code.
[lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
