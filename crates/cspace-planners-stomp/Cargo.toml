# examples/stomp_benchmark_port.rs only (Phase 8's property-based
# measurement, PORTING-PLAN.md §263): `cspace-planners-sbp` supplies the
# `JointModelGroupSpace` metric the C++ OMPL baseline's `length` is measured
# in, so the two sides of Phase 7 condition 3 are the same instrument.
cspace-planners-sbp.workspace = true
cspace-srdf.workspace = true
# `stomp_benchmark_port.rs`'s pose decoding only -- see
# `cspace-test-support`'s own module doc for why a shared crate closes this
# kind of duplication.
cspace-test-support.workspace = true
rand_chacha.workspace = true
# `examples/optimize_benchmark_stomp.rs` reads the benchmark problem set and
# writes its per-problem NDJSON; the library half needs neither.
serde_json.workspace = true
urdf-rs.workspace = true

