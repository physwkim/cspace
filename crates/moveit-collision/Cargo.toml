[package]
name = "moveit-collision"
description = "RobotModel-independent parts of moveit_core/collision_detection: AllowedCollisionMatrix, the collision request/result types, and the World object container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
moveit-error.workspace = true
moveit-geometry.workspace = true
moveit-model.workspace = true
# Not for the octree algorithms -- those stay in `moveit-geometry` -- but so
# `parry.rs`'s `OctreeCache` can name `Weak<moveit_octomap::OcTree>`. Keying a
# cache on an `Arc` address is only sound while something pins the
# allocation; see `OctreeCache`'s own doc. `moveit-geometry`, already a
# dependency here, depends on this crate too, so this adds no edge the graph
# did not have.
moveit-octomap.workspace = true
moveit-srdf.workspace = true
moveit-state.workspace = true
glamx.workspace = true
nalgebra.workspace = true
parry3d-f64.workspace = true

[dev-dependencies]
approx.workspace = true
moveit-test-support.workspace = true
serde.workspace = true
serde_json.workspace = true
urdf-rs.workspace = true

[lints]
workspace = true
