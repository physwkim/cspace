[package]
name = "moveit-planners-chomp"
description = "CHOMP (Covariant Hamiltonian Optimization for Motion Planning) core numeric package for moveit-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
moveit-collision.workspace = true
moveit-constraints.workspace = true
moveit-distance-field.workspace = true
moveit-error.workspace = true
moveit-geometry.workspace = true
moveit-model.workspace = true
moveit-sampling.workspace = true
moveit-state.workspace = true
nalgebra.workspace = true
moveit-trajectory.workspace = true
rand.workspace = true
rand_distr.workspace = true

[dev-dependencies]
approx.workspace = true
# Dev-only, for `examples/` (Phase 8's property-based measurement,
# PORTING-PLAN.md §263). `moveit-scene` supplies the
# `PlanningScene::is_path_valid` that `solve`'s injected
# `mesh_to_mesh_collision_free` closure needs -- upstream's
# `PlanningScene::isPathValid` over the group trajectory -- and both
# `chomp_benchmark_port.rs` and `optimize_benchmark_chomp.rs` use it.
# `moveit-planners-sbp` supplies the `JointModelGroupSpace` metric the C++
# OMPL baseline's `length` is measured in, used by `chomp_benchmark_port.rs`
# only. Deliberately dev-only: the library half still cannot reach
# `moveit-scene`, which is the whole reason `optimizer` takes that check as an
# injected closure (`optimizer.rs`, PORTING-PLAN.md §154).
moveit-planners-sbp.workspace = true
moveit-scene.workspace = true
moveit-srdf.workspace = true
moveit-test-support.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
urdf-rs.workspace = true

[lints]
workspace = true
