[package]
name = "moveit-planners-stomp"
description = "STOMP planner support types (matrix<->trajectory conversion, trajectory filters), ported from moveit_planners/stomp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
moveit-collision.workspace = true
moveit-constraints.workspace = true
moveit-error.workspace = true
moveit-kinematics.workspace = true
moveit-model.workspace = true
moveit-sampling.workspace = true
moveit-scene.workspace = true
moveit-state.workspace = true
moveit-stomp-core.workspace = true
moveit-trajectory.workspace = true
nalgebra.workspace = true
rand.workspace = true

[dev-dependencies]
moveit-geometry.workspace = true
# examples/stomp_benchmark_port.rs only (Phase 8's property-based
# measurement, PORTING-PLAN.md §263): `moveit-planners-sbp` supplies the
# `JointModelGroupSpace` metric the C++ OMPL baseline's `length` is measured
# in, so the two sides of Phase 7 condition 3 are the same instrument.
moveit-planners-sbp.workspace = true
moveit-srdf.workspace = true
# `stomp_benchmark_port.rs`'s pose decoding only -- see
# `moveit-test-support`'s own module doc for why a shared crate closes this
# kind of duplication.
moveit-test-support.workspace = true
rand_chacha.workspace = true
# `examples/optimize_benchmark_stomp.rs` reads the benchmark problem set and
# writes its per-problem NDJSON; the library half needs neither.
serde_json.workspace = true
urdf-rs.workspace = true

[lints]
workspace = true
