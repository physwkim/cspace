[package]
name = "moveit-planning"
description = "Planner-agnostic planning request/response types and the default request/response adapter chain for moveit-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
moveit-collision.workspace = true
moveit-constraints.workspace = true
moveit-error.workspace = true
moveit-geometry.workspace = true
moveit-model.workspace = true
moveit-scene.workspace = true
moveit-state.workspace = true
moveit-trajectory.workspace = true

[dev-dependencies]
moveit-srdf.workspace = true
urdf-rs.workspace = true
# Dev-only, and a dependency *cycle* by design: `moveit-planners-sbp`
# depends on this crate for `PlanningRequest`/`PlannerManager`, and this
# crate depends back on it only so the crate-level doctest can plan for
# real. Cargo permits a cycle through `[dev-dependencies]` (it is a
# separate build of this crate's test targets, not of the library other
# crates link). Neither the library nor its public types know sbp exists.
moveit-planner-registry.workspace = true
moveit-planners-sbp.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[lints]
workspace = true
